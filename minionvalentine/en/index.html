<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Для Кицi 🐱💖</title>

<style>
:root{
  --pink1:#ff4d6d;
  --pink2:#ff8fa3;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: linear-gradient(135deg,#fff0f6,#ffe5ec);
  overflow:hidden;
}

.card{
  background:white;
  padding:30px;
  border-radius:28px;
  box-shadow:0 25px 60px rgba(0,0,0,.15);
  text-align:center;
  width:min(700px,92vw);
  position:relative;
}

.badge{
  font-size:13px;
  font-weight:600;
  color:#b4233d;
  margin-bottom:10px;
}

img{
  width:300px;
  border-radius:20px;
  margin:15px 0;
  box-shadow:0 15px 40px rgba(255,77,109,.25);
}

h1{
  margin:0;
  font-size:28px;
}

#text{
  margin-top:10px;
  font-size:18px;
  color:#555;
  white-space:pre-line;
  min-height:50px;
  transition:.2s;
}

.actions{
  display:flex;
  gap:15px;
  justify-content:center;
  margin-top:20px;
  position:relative;
  min-height:70px;
}

button{
  border:none;
  padding:14px 22px;
  border-radius:16px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  min-width:140px;
  transition:.2s;
}

#yes{
  background:linear-gradient(135deg,var(--pink1),var(--pink2));
  color:white;
  transform-origin:top center;
  box-shadow:0 15px 35px rgba(255,77,109,.35);
}

#yes:hover{transform:scale(1.05);}

#no{
  background:#111827;
  color:white;
  position:relative;
}

.hint{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

</style>
</head>
<body>

<div class="card">
  <div class="badge">🐾 Для коханої</div>

  <img id="gif" src="minion-minion-loves.gif" alt="love">

  <h1> will you be my Valentine? 😼💘</h1>
  <div id="text">Я буду тебе цілувати 😏</div>

  <div class="actions" id="actions">
    <button id="yes" type="button">Так 😎</button>
    <button id="no" type="button">Ні 🙃</button>
  </div>

  <div class="hint" id="hint">Подумай добре… я ж лижу ахуєнно 😌</div>
</div>

<script>

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const gif = document.getElementById("gif");
const text = document.getElementById("text");
const hint = document.getElementById("hint");
const actions = document.getElementById("actions");

let clicks = 0;

const scales = [1.15,1.4,1.8,2.4,3.2];

const texts = [
  "Киць, ну ти серйозно? 😼",
  "Подумай ще раз… я ж красавчик 😏",
  "Я ж буду носити пакети з магазину 😌",
  "Добре, я буду мити посуд...",
  "ІРІНА, ЙОП ТВАЮ МАТЬ!!! "
];

function changeText(newText){
  text.style.opacity = 0;
  setTimeout(()=>{
    text.innerText = newText;
    text.style.opacity = 1;
  },150);
}

function moveNo(){
  const box = actions.getBoundingClientRect();
  const btn = no.getBoundingClientRect();

  const maxX = box.width - btn.width;
  const maxY = box.height - btn.height;

  no.style.position = "absolute";
  no.style.left = Math.random()*maxX + "px";
  no.style.top  = Math.random()*maxY + "px";
}

no.addEventListener("click",(e)=>{
  e.preventDefault();

  if(clicks < texts.length){
    changeText(texts[clicks]);
    yes.style.transform = `scale(${scales[clicks]})`;

    if(clicks >= 2) moveNo();
    clicks++;
  } else {
    moveNo();
  }
});

yes.addEventListener("click",(e)=>{
  e.preventDefault();

  gif.src = "fireworks-exploding-heart.gif";
  document.querySelector("h1").innerText = "УРА, ти сказала ТАКК 🎉💞";
  changeText("Я кохаю тебе!!! ❤️");
  hint.innerText = "Приїдеш, роздягайся і лягай на ліжко";

  yes.style.display = "none";
  no.style.display = "none";
});

</script>

</body>
</html>
